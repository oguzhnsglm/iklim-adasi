<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Snake - Dengeli Hız</title>
    <style>
        /* --- CSS STİLLERİ --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #3e2723; /* Arka plan */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            user-select: none;
        }

        .game-wrapper {
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
            background-color: #4e342e;
        }

        .header-bar {
            background-color: #3e2723;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            border-bottom: 3px solid #281a16;
            height: 45px;
        }

        .stat-group {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .icon { font-size: 1.4rem; }
        .stat-label { font-size: 0.9rem; color: #bcaaa4; font-weight: normal; }
        .stat-value { color: #fff; }

        .canvas-container {
            position: relative;
            width: 400px;
            height: 400px;
            background-color: #5d4037;
            border: 5px solid transparent;
            transition: border-color 0.1s;
        }

        /* ZARAR EFEKTİ */
        .damage-effect {
            border-color: #ff3333 !important;
            box-shadow: inset 0 0 50px rgba(255, 0, 0, 0.5);
        }

        canvas { display: block; }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            backdrop-filter: blur(2px);
        }

        .hidden { display: none !important; }

        .popup {
            background: #fff;
            color: #333;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            min-width: 220px;
        }

        h2 { margin: 0 0 15px 0; color: #d32f2f; font-size: 2rem; }
        
        button {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
            box-shadow: 0 4px #1b5e20;
            transition: transform 0.1s;
        }

        button:active {
            box-shadow: 0 2px #1b5e20;
            transform: translateY(2px);
        }

        .controls-hint {
            text-align: center;
            padding: 12px;
            font-size: 0.9rem;
            color: #d7ccc8;
            background-color: #3e2723;
            border-top: 1px solid #281a16;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header-bar">
            <div class="stat-group">
                <span class="icon">🍎</span>
                <span id="score" class="stat-value">0</span>
            </div>
            <div class="stat-group">
                <span class="icon">🏆</span>
                <span class="stat-label">En İyi:</span>
                <span id="highScore" class="stat-value">0</span>
            </div>
            <div class="stat-group" style="margin-left: auto;">
                <span class="icon">❤️</span>
                <span id="lives" class="stat-value">3</span>
            </div>
        </div>

        <div class="canvas-container" id="canvasContainer">
            <canvas id="gameCanvas" width="400" height="400"></canvas>
            
            <div id="gameOverScreen" class="overlay hidden">
                <div class="popup">
                    <h2>OYUN BİTTİ</h2>
                    <p>Skorun: <span id="finalScore">0</span></p>
                    <button id="restartBtn">🔄 Yeniden Oyna</button>
                </div>
            </div>
        </div>

        <div class="controls-hint">
            Yön Tuşları ile oyna | 🍌 = İyi | 🔋 = Kötü
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const canvasContainer = document.getElementById('canvasContainer');
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const livesEl = document.getElementById('lives');
        const finalScoreEl = document.getElementById('finalScore');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const restartBtn = document.getElementById('restartBtn');

        const GRID_SIZE = 20; 
        const TILE_COUNT = canvas.width / GRID_SIZE; 
        
        // --- HIZ AYARI ---
        // 180ms: Kontrollü ama akıcı.
        const GAME_SPEED = 180; 

        const COLORS = {
            boardLight: '#8D6E63', // Açık Toprak
            boardDark: '#795548',  // Koyu Toprak
            snakeBody: '#4674E9',  // Mavi Yılan
        };

        let score = 0;
        let highScore = localStorage.getItem('ecoSnakeHighScore') || 0;
        let lives = 3;
        let gameLoopId;
        let hazardIntervalId;
        let hazardTimeouts = [];

        let snake = [];
        let dx = 0;
        let dy = 0;
        let nextDx = 1; 
        let nextDy = 0;
        let isGameRunning = false;

        // Kemik çıkarıldı, sadece sebze-meyve
        const GOOD_ICONS = ['🍎', '🍌', '🍉', '🍇', '🥕'];
        const BAD_ICONS = ['🔋', '🥤', '💊', '🧴', '🛢️'];

        let goodWaste = null;
        let hazardousWastes = [];

        highScoreEl.innerText = highScore;

        function initGame() {
            if (isGameRunning) return;
            isGameRunning = true;

            score = 0;
            lives = 3;
            updateUI();
            canvasContainer.classList.remove('damage-effect');
            
            // Yılan Başlangıç
            snake = [
                { x: 5, y: 10 },
                { x: 4, y: 10 },
                { x: 3, y: 10 },
                { x: 2, y: 10 }
            ];
            
            dx = 1; dy = 0;
            nextDx = 1; nextDy = 0;

            hazardousWastes = [];
            clearAllTimers();
            
            gameOverScreen.classList.add('hidden');
            
            // İlk yemek sabit
            goodWaste = { x: 12, y: 10, icon: GOOD_ICONS[0] };
            
            gameLoopId = setInterval(gameLoop, GAME_SPEED);
            hazardIntervalId = setInterval(spawnHazardousWaste, 15000);
        }

        function clearAllTimers() {
            if (gameLoopId) clearInterval(gameLoopId);
            if (hazardIntervalId) clearInterval(hazardIntervalId);
            hazardTimeouts.forEach(t => clearTimeout(t));
            hazardTimeouts = [];
        }

        function gameLoop() {
            update();
            draw();
        }

        function update() {
            dx = nextDx;
            dy = nextDy;

            const head = { x: snake[0].x + dx, y: snake[0].y + dy };

            // Duvar Kontrolü
            if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
                endGame();
                return;
            }

            // Kendine Çarpma
            for (let i = 0; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    endGame();
                    return;
                }
            }

            snake.unshift(head);

            // İyi Atık
            if (goodWaste && head.x === goodWaste.x && head.y === goodWaste.y) {
                score++;
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('ecoSnakeHighScore', highScore);
                }
                updateUI();
                spawnGoodWaste();
            } else {
                snake.pop();
            }

            // Zararlı Atık
            for (let i = 0; i < hazardousWastes.length; i++) {
                const waste = hazardousWastes[i];
                if (head.x === waste.x && head.y === waste.y) {
                    hazardousWastes.splice(i, 1);
                    triggerDamageEffect();
                    lives--;
                    updateUI();
                    if (snake.length > 2) snake.pop();
                    if (lives <= 0) endGame();
                    break;
                }
            }
        }

        function triggerDamageEffect() {
            canvasContainer.classList.add('damage-effect');
            setTimeout(() => {
                canvasContainer.classList.remove('damage-effect');
            }, 500);
        }

        function draw() {
            // 1. Arka Plan
            for (let row = 0; row < TILE_COUNT; row++) {
                for (let col = 0; col < TILE_COUNT; col++) {
                    ctx.fillStyle = (row + col) % 2 === 0 ? COLORS.boardLight : COLORS.boardDark;
                    ctx.fillRect(col * GRID_SIZE, row * GRID_SIZE, GRID_SIZE, GRID_SIZE);
                }
            }

            // 2. İkonlar
            if (goodWaste) drawIcon(goodWaste.icon, goodWaste.x, goodWaste.y);
            hazardousWastes.forEach(w => drawIcon(w.icon, w.x, w.y));

            // 3. Bütünleşik Yılan Çizimi
            if (snake.length > 0) {
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.lineWidth = GRID_SIZE - 2; 
                ctx.strokeStyle = COLORS.snakeBody;
                
                ctx.beginPath();
                // Yılanın omurgasını oluşturuyoruz
                ctx.moveTo(snake[0].x * GRID_SIZE + GRID_SIZE/2, snake[0].y * GRID_SIZE + GRID_SIZE/2);
                for (let i = 1; i < snake.length; i++) {
                    ctx.lineTo(snake[i].x * GRID_SIZE + GRID_SIZE/2, snake[i].y * GRID_SIZE + GRID_SIZE/2);
                }
                ctx.stroke();

                // Kafa ve Gözler
                drawEyes(snake[0].x * GRID_SIZE, snake[0].y * GRID_SIZE, dx, dy);
            }
        }

        function drawEyes(x, y, dx, dy) {
            ctx.fillStyle = 'white';
            const size = 5;
            
            ctx.beginPath();
            ctx.arc(x + 6, y + 6, size, 0, Math.PI * 2);
            ctx.arc(x + 14, y + 6, size, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'black';
            const pX = dx * 2.5; 
            const pY = dy * 2.5;
            ctx.beginPath();
            ctx.arc(x + 6 + pX, y + 6 + pY, 2.5, 0, Math.PI * 2);
            ctx.arc(x + 14 + pX, y + 6 + pY, 2.5, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawIcon(icon, gx, gy) {
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(icon, gx * GRID_SIZE + 10, gy * GRID_SIZE + 12);
        }

        function spawnGoodWaste() {
            let pos;
            do { pos = getRandomPos(); } while (isOccupied(pos));
            goodWaste = { x: pos.x, y: pos.y, icon: randomItem(GOOD_ICONS) };
        }

        function spawnHazardousWaste() {
            if (!isGameRunning) return;
            let pos;
            do { pos = getRandomPos(); } while (isOccupied(pos) || (goodWaste && pos.x === goodWaste.x && pos.y === goodWaste.y));
            
            const waste = { x: pos.x, y: pos.y, icon: randomItem(BAD_ICONS) };
            hazardousWastes.push(waste);

            const tId = setTimeout(() => {
                const idx = hazardousWastes.indexOf(waste);
                if (idx > -1) hazardousWastes.splice(idx, 1);
            }, 15000);
            hazardTimeouts.push(tId);
        }

        function getRandomPos() {
            return { x: Math.floor(Math.random() * TILE_COUNT), y: Math.floor(Math.random() * TILE_COUNT) };
        }

        function isOccupied(pos) {
            return snake.some(s => s.x === pos.x && s.y === pos.y);
        }

        function randomItem(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function updateUI() {
            scoreEl.innerText = score;
            highScoreEl.innerText = highScore;
            livesEl.innerText = lives;
        }

        function endGame() {
            isGameRunning = false;
            clearAllTimers();
            finalScoreEl.innerText = score;
            gameOverScreen.classList.remove('hidden');
        }

        document.addEventListener('keydown', e => {
            if (!isGameRunning) return;
            if (e.key === 'ArrowUp' && dy === 0) { nextDx = 0; nextDy = -1; }
            else if (e.key === 'ArrowDown' && dy === 0) { nextDx = 0; nextDy = 1; }
            else if (e.key === 'ArrowLeft' && dx === 0) { nextDx = -1; nextDy = 0; }
            else if (e.key === 'ArrowRight' && dx === 0) { nextDx = 1; nextDy = 0; }
        });

        restartBtn.addEventListener('click', () => {
            initGame();
        });

        initGame();
    </script>
</body>
</html>
